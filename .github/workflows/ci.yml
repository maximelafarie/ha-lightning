name: CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiohttp
          # Install Home Assistant core to satisfy imports in config_flow and integration modules
          pip install homeassistant

      - name: Run tests
        run: |
          # Ensure the repository root is on PYTHONPATH so tests can import the integration
          export PYTHONPATH="${PWD}"
          pytest -q
