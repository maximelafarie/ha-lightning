name: Create Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'custom_components/ha_lightning/manifest.json'

# Grant the workflow permissions needed to create releases using GITHUB_TOKEN
permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/ha_lightning/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          echo "Creating release archive..."
          git fetch --no-tags --depth=1 origin || true
          git archive --format=zip -o release.zip HEAD

      - name: Create GitHub Release and attach archive
        # use softprops/action-gh-release to avoid deprecated set-output usage
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }}

            This release was created automatically by the release workflow.
          draft: false
          prerelease: false
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
